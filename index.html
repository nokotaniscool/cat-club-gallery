<!DOCTYPE html>
<html>
<head>
  <title>Cat Club 🐱</title>
  <style>
    body { font-family: Arial; text-align:center; background:#f5f5f5; }
    #gallery { display: flex; flex-wrap: wrap; justify-content: center; }
    #gallery img { margin:5px; border-radius:10px; width:200px; height:200px; object-fit:cover; transition: transform 0.2s; }
    #gallery img:hover { transform: scale(1.1); }
    #preview { margin-top:10px; border:2px dashed #ccc; border-radius:10px; }
  </style>
</head>
<body>

<h1>Welcome to the Cat Club 🐱</h1>
<p>Send your best cat pictures!</p>

<h2>Cat Gallery</h2>
<div id="gallery"></div>

<br><br>
<h2>Upload Your Cat 🐱</h2>
<input type="file" id="catUpload" accept="image/*"><br>
<img id="preview" width="200"><br><br>
<button onclick="uploadCat()">Submit Cat</button>

<script>
  // ==== SETTINGS ====
  const cloudName = 'dk51b0rri';         // Your Cloudinary cloud name
  const unsignedUploadPreset = 'catclub'; // Your unsigned upload preset
  const cloudFolder = 'catclub';          // Folder in Cloudinary for cat images
  const gallery = document.getElementById("gallery");
  const preview = document.getElementById("preview");

  // ==== Preview selected image ====
  document.getElementById("catUpload").addEventListener('change', function() {
    const file = this.files[0];
    if (file) preview.src = URL.createObjectURL(file);
  });

  // ==== Load all images from Cloudinary folder ====
  async function loadCats() {
    try {
      // Fetch list of images in folder (Cloudinary provides a JSON endpoint)
      const res = await fetch(`https://res.cloudinary.com/${cloudName}/image/list/${cloudFolder}.json`);
      const data = await res.json();
      data.resources.forEach(r => addCatToGallery(r.secure_url));
    } catch(err) {
      console.error("Failed to load cats:", err);
    }
  }

  function addCatToGallery(url) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "Cute cat";
    gallery.appendChild(img);
  }

  // ==== Upload new cat to Cloudinary ====
  async function uploadCat() {
    const file = document.getElementById("catUpload").files[0];
    if (!file) { alert("Please select a cat first!"); return; }

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', unsignedUploadPreset);
    formData.append('folder', cloudFolder);

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      const imgUrl = data.secure_url;

      // Add to gallery immediately
      addCatToGallery(imgUrl);
      alert("Cat uploaded to Cloudinary! 🎉");

      // Clear preview
      preview.src = "";
      document.getElementById("catUpload").value = "";

    } catch(err) {
      console.error(err);
      alert("Upload failed. Check Cloudinary info.");
    }
  }

  // ==== Load gallery on page load ====
  loadCats();
</script>

</body>
</html>

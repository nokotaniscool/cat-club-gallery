<!DOCTYPE html>
<html>
<head>
  <title>Cat Club 🐱</title>
  <style>
    body { font-family: Arial; text-align:center; background:#f5f5f5; }
    #gallery img { margin:5px; border-radius:10px; width:200px; height:200px; object-fit:cover; }
    #preview { margin-top:10px; border:2px dashed #ccc; border-radius:10px; }
  </style>
</head>
<body>

  <h1>Welcome to the Cat Club 🐱</h1>
  <p>Send your best cat pictures!</p>

  <h2>Cat Gallery</h2>
  <div id="gallery"></div>

  <br><br>
  <h2>Upload Your Cat 🐱</h2>
  <input type="file" id="catUpload" accept="image/*">
  <br>
  <img id="preview" width="200">
  <br><br>
  <button onclick="uploadCat()">Submit Cat</button>

<script>
  // ==== SETTINGS ====
  const cloudName = 'mycatcloud';        // Replace with your Cloudinary cloud name
  const unsignedUploadPreset = 'catclub'; // Replace with your unsigned upload preset
  const githubJSON = 'https://raw.githubusercontent.com/nokotaniscool/cat-club-gallery/main/cats.json';
  const gallery = document.getElementById("gallery");
  const preview = document.getElementById("preview");

  // ==== Preview selected image ====
  document.getElementById("catUpload").addEventListener('change', function() {
    const file = this.files[0];
    if (file) preview.src = URL.createObjectURL(file);
  });

  // ==== Load existing cats from JSON ====
  async function loadCats() {
    try {
      const res = await fetch(githubJSON);
      const cats = await res.json();
      cats.forEach(url => addCatToGallery(url));
    } catch(err) {
      console.error("Failed to load cats:", err);
    }
  }

  function addCatToGallery(url) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "Cute cat";
    gallery.appendChild(img);
  }

  // ==== Upload new cat to Cloudinary ====
  async function uploadCat() {
    const file = document.getElementById("catUpload").files[0];
    if (!file) { alert("Please select a cat first!"); return; }

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', unsignedUploadPreset);

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      const imgUrl = data.secure_url;

      // Add to gallery immediately
      addCatToGallery(imgUrl);
      alert("Cat uploaded to Cloudinary! 🎉");

      // Optional: log URL for you to save permanently if needed
      console.log("Add this URL to cats.json if you want it persistent:", imgUrl);

      // Clear preview
      preview.src = "";
      document.getElementById("catUpload").value = "";

    } catch(err) {
      console.error(err);
      alert("Upload failed. Check Cloudinary info.");
    }
  }

  // ==== Load gallery on page load ====
  loadCats();
</script>

</body>
</html>
